<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Tournament</title>
  <script src="function.js"></script>
  <style>


  </style>
</head>
<body>
  <div id="canvas-box" >
    <canvas id="canvas" onContextmenu="return false;">
    </canvas>

    <input type="number" id="width-input" placeholder="width" data-mode="width" class="input-contents">
    <input type="number" id="height-input" placeholder="height" data-mode="height" class="input-contents">
    <input type="text" id="text-title" placeholder="Title">
    <input type="text" id="font-size-input" placeholder="font-size">

    <button id="create-box-button">ボックスを追加</button>
    <div id="right-mouse-click-menu" onContextmenu="return false;">
      <button id="ArrowCreateButton">
        矢印を追加
      </button>
    </div>
  </div>

  <style>
    #canvas-box{
      max-width: 100%;
      width: 600px;
      height: 600px;
    }

    @media screen and (max-width: 480px){
      #canvas-box{
        max-width: 100%;
      }
    }
  </style>
  <script>
    let canvas = document.getElementById("canvas");
    let canvas_width = canvas.width;
    let canvas_height = canvas.height;
    let canvas_box = document.getElementById("canvas-box");
    let input_contents = document.getElementsByClassName("input-contents");
    let create_box_button = document.getElementById("create-box-button");
    let arrow_create_button = document.getElementById("ArrowCreateButton");
    let default_width_value = 180;
    let default_height_value = 50;
    let connect_line_data_index = 0;
    let width_value = default_width_value;
    let height_value = default_height_value;
    let connect_line_data = [];
    let connect_relationship = [];

    canvas.width = canvas_box.clientWidth;
    canvas.height = canvas_box.clientHeight;
    let dragging;

    const point = {
      x: null,
      y: null
    }

    let ctx = canvas.getContext("2d");

    let contents_data = [
    ];
    let dragging_contents_data_histroy = [

    ];
    let dragging_contents_data = {};
    
    let arrow_position_select_mode = false;
    let arrow_position_select_origin_contents = null;
    let arrows_data = {

    }
    let arrow_now_data = {
      contents_origin_id: null,
      positionX: null,
      positionY: null
    }
    let arrow_mode = false;

    let tournament_box = [];

    let ShiftPush = false;

    let contents_index = 0;
    // ("test_2", 0, 30, 100, 20);
    // boxAdd("test_3", 0, 60, 100, 20);
    let connect_cursor_data = {
      color: null,
      directon: null,
      target_id: null
    }
    let tounament_relationship_cursor_data = {
      center_line: {
        x: null,
        y: null,
        width: null,
        height: null
      }
    }
    let init_dragging_contents_data;
    let write_once;
    let get_content_contextmenu;

    let text_title_input = document.getElementById("text-title");
    let text_title_value;
    let font_size_input = document.getElementById("font-size-input");
    let font_size_value;
    let right_mouse_click_menu = document.getElementById("right-mouse-click-menu");
    let context_menu_on_contents_data_id = "";
    let cursor_border_x_start;
    let cursor_border_y_start;
    let cursor_border_x_end;
    let cursor_border_y_end;

    // canvas.addEventListener("click", function(e){
    //   const rect = canvas.getBoundingClientRect();

    //   point.x = e.clientX - rect.left;
    //   point.y = e.clientY - rect.top;
      
    //   let target_data = BoxDataGetById("test_1");
    //   BoxOnClickCheck(target_data, point);
    // });

    const Start = function(){
      ContentsAdd("delete_box_1", canvas.width - 60, 0, 60, 60, "fill", true, null, "red");

    }
    const Update = function(e){
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      contents_data.forEach((contents_data_one, index) => {

        if(contents_data_one.children != null && contents_data_one.children.length != 0){
          ContentsDataOverWrite(contents_data_one.children.id, contents_data_one.children);
        }
        if(contents_data_one.mode == "stroke"){
          ctx.strokeStyle = contents_data_one.style;

          ctx.strokeRect(contents_data_one.positionX, contents_data_one.positionY, contents_data_one.width, contents_data_one.height);
        }else if(contents_data_one.mode == "fill"){
          ctx.fillStyle = contents_data_one.style;

          ctx.fillRect(contents_data_one.positionX, contents_data_one.positionY, contents_data_one.width, contents_data_one.height);
        }else if(contents_data_one.mode == "image"){
          var img = new Image();
          img.src = contents_data_one.image.image_src;
          ctx.fillStyle = contents_data_one.style;
          
          img.onload = function(event){
            ctx.drawImage(img, contents_data_one.positionX, contents_data_one.positionY,
            contents_data_one.width, contents_data_one.height);
          }
        }else if(contents_data_one.mode == "text"){
          ctx.fillStyle = contents_data_one.style;
          // ctx.font = contents_data_one.font_size;
          ctx.font = `bold ${contents_data_one.font_size}pt Arial`;
          ctx.fillText(contents_data_one.text, contents_data_one.positionX, contents_data_one.positionY);
          
        }
        if(connect_cursor_data != null && arrow_position_select_mode){
          if(connect_cursor_data.target_id == contents_data_one.id){
            let border_data = contents_data_one.border_data;
            ctx.beginPath();
            if(connect_cursor_data.direction == "width_up"){
              ctx.moveTo(border_data.width_up.x_start, border_data.width_up.y_start);
              ctx.lineTo(border_data.width_up.x_end, border_data.width_up.y_start);
            }else if(connect_cursor_data.direction == "width_down"){
              ctx.moveTo(border_data.width_down.x_start, border_data.width_down.y_start);
              ctx.lineTo(border_data.width_down.x_end, border_data.width_down.y_start);
            }else if(connect_cursor_data.direction == "height_right"){
              ctx.moveTo(border_data.height_right.x_start, border_data.height_right.y_start);
              ctx.lineTo(border_data.height_right.x_start, border_data.height_right.y_end);
            }else if(connect_cursor_data.direction == "height_left"){
              ctx.moveTo(border_data.height_left.x_start, border_data.height_left.y_start);
              ctx.lineTo(border_data.height_left.x_start, border_data.height_left.y_end);
            }
            ctx.strokeStyle = connect_cursor_data.color;
            ctx.stroke();
          }
        }

      });

      connect_line_data.forEach((connect_line_data_one, index) => {
        //トーナメント表どうしをつなげる線を書くところ。
        let start_contents = ContentsDataGetById(connect_line_data_one.start_id);
        let target_contents =  ContentsDataGetById(connect_line_data_one.target_id);
        let start_contents_direction_get_data;
        let target_contents_direction_get_data;

        let connect_relationship_get;
        connect_relationship.forEach((connect_relation) => {
          if(connect_relation.origin_id == connect_line_data_one.start_id){
            connect_relationship_get = connect_relation;
          }
        });
        start_contents_direction_get_data = BorderDataOfContentsGetByDirectionName(start_contents, connect_line_data_one.start_direction);
        target_contents_direction_get_data = BorderDataOfContentsGetByDirectionName(target_contents, connect_line_data_one.target_direction);
        ctx.beginPath();
        if(connect_line_data_one.start_direction == "width_up" || connect_line_data_one.start_direction == "width_down"){

          //最初に移動
         ctx.moveTo(start_contents.positionX + start_contents.width / 2, start_contents_direction_get_data.y_start);
         //初めの線
         ctx.lineTo(start_contents.positionX + start_contents.width / 2, start_contents_direction_get_data.y_start + (100 * connect_line_data_one.direction_y));
         //真ん中の線
         ctx.lineTo(target_contents.positionX + target_contents.width / 2, start_contents_direction_get_data.y_start + (100 * connect_line_data_one.direction_y));
         
         connect_relationship_get.center_line.x = start_contents.positionX + start_contents.width / 2;
         connect_relationship_get.center_line.y = start_contents_direction_get_data.y_start + (100 * connect_line_data_one.direction_y);
         connect_relationship_get.center_line.width = Math.abs((start_contents.positionX + start_contents.width / 2) - (target_contents.positionX + target_contents.width / 2));
         connect_relationship_get.center_line.height = null;
        
         //End
         ctx.lineTo(target_contents.positionX + target_contents.width / 2,  target_contents_direction_get_data.y_start);
         
        }else if(connect_line_data_one.start_direction =="height_left" || connect_line_data_one.start_direction == "height_right"){
          //最初に移動
         ctx.moveTo(start_contents_direction_get_data.x_end, start_contents.positionY + start_contents.height / 2);
         //初めの線
         ctx.lineTo(start_contents_direction_get_data.x_end + (100 * connect_line_data_one.direction_x), (start_contents.positionY) + (start_contents.height / 2));
         //真ん中の線(縦線の予定)
         ctx.lineTo(start_contents_direction_get_data.x_end + (100 * connect_line_data_one.direction_x), (target_contents.positionY) + (target_contents.height / 2));
         connect_relationship_get.center_line.x = start_contents_direction_get_data.x_end + (100 * connect_line_data_one.direction_x);
         connect_relationship_get.center_line.y = target_contents.positionY + target_contents.height / 2;
         connect_relationship_get.center_line.width = null;
         connect_relationship_get.center_line.height = Math.abs((start_contents.positionY + start_contents.height / 2) 
                                                      - (target_contents.positionY + target_contents.height / 2));
         //最後の線(ターゲットのボックスと繋げる)
         ctx.lineTo(target_contents_direction_get_data.x_end, target_contents.positionY + target_contents.height / 2);
         //-------------------------------------------------------------------------------------------------------------------------------------------------------------
         //target_contentsが真ん中のトーナメント表の線を超えてしまったら
        //  if(connect_relationship_get.center_line.x <= target_contents.positionX + target_contents.width){
        //    target_contents.positionX = 0;
        //  }
         
        }
 
        ctx.strokeStyle = "#000";
        ctx.stroke();
      });

      if(arrow_now_data != null && arrow_mode && arrow_now_data.positionX != null){
        //トーナメント表を描画するためのピンクやじるしくんの描画

        let init_box = ContentsDataGetById(`${arrow_now_data.contents_origin_id}`);

        ctx.beginPath();
        if(arrow_now_data.start_origin_direction == "width_up" || arrow_now_data.start_origin_direction == "width_down"){
          ctx.moveTo(arrow_now_data.start_positionX + init_box.width / 2, arrow_now_data.start_positionY);
          ctx.lineTo(arrow_now_data.positionX, arrow_now_data.positionY);

        }else if(arrow_now_data.start_origin_direction == "height_right" || arrow_now_data.start_origin_direction == "height_left"){
          ctx.moveTo(arrow_now_data.start_positionX, arrow_now_data.start_positionY + init_box.height / 2);
          ctx.lineTo(arrow_now_data.positionX, arrow_now_data.positionY);
        }
        ctx.strokeStyle = "pink";
        ctx.stroke();
        // ctx.fillRect(init_box.positionX, init_box.positionY, );
      }
      
      // ctx.font='bold 50pt Arial';

      // ctx.fillStyle = "black";
      // ctx.fillText("HelloWorld", 0, 100);
      
      window.requestAnimationFrame(Update);
    }

    Start();
    Update();

    canvas.addEventListener("click", function(e){
      const rect = canvas.getBoundingClientRect();
      point.x = e.clientX - rect.left;
      point.y = e.clientY - rect.top;
      contents_data.forEach((contents_data_one) => {
        if(arrow_position_select_mode){
          if(ContentsOnClickCheck(ContentsDataGetById(contents_data_one.id), point) && connect_cursor_data.direction != undefined){
            let connect_line_data_result = ArrowStartDurationInBoxClickCheck(contents_data_one, point);
            //ピンクヤジルシ追加―
            let border_data_get_by_direction = BorderDataOfContentsGetByDirectionName(contents_data_one, connect_cursor_data.direction);
            arrow_mode = true;
            arrow_now_data = {
              contents_origin_id: context_menu_on_contents_data_id,
              positionX: null,
              positionY: null,
              start_positionX: border_data_get_by_direction.x_start,
              start_positionY: border_data_get_by_direction.y_start,
              start_origin_direction: connect_cursor_data.direction
            }
            arrow_position_select_mode = false;
            // connect_cursor_data = {};
          }
        }

      });
    });
    canvas.addEventListener("mousedown", function(e){
      if(e.button == 0){
        // 左クリックを押したら
        const rect = canvas.getBoundingClientRect();
        point.x = e.clientX - rect.left;
        point.y = e.clientY - rect.top;
        
        contents_data.forEach((contents_data_one) => {
          if(ContentsOnClickCheck(ContentsDataGetById(contents_data_one.id), point)){
            if(!dragging){
              dragging_contents_data = ContentsDataGetById(contents_data_one.id);
              dragging = true;
            }
          }
          
          if(arrow_mode){
            if(ContentsOnClickCheck(ContentsDataGetById(contents_data_one.id), null,arrow_now_data.positionX, arrow_now_data.positionY)){
              let start_contents_direction_get_data;
              let target_contents_direction_get_data;
              // 矢印がとあるボックスまで伸びてて、そこで左クリックをしたら
              //トーナメント表のコネクトラインを追加！
              let origin_contents_data = ContentsDataGetById(arrow_now_data.contents_origin_id);
              let get_direction_number = NumberDirectionGetByDirectionName(connect_cursor_data.direction);
              ConnectLineAdd("connect_line_" + connect_line_data_index, arrow_now_data.contents_origin_id,
              contents_data_one.id, mode="box", connect_cursor_data.direction, connect_cursor_data.direction, get_direction_number.x, get_direction_number.y);
              //真ん中の線の情報を追加。
              connect_relationship.push({
                origin_id: origin_contents_data.id,
                target_id: contents_data_one.id,
                center_line: {
                  x: null,
                  y: null,
                  width: null,
                  height: null,
                  direction: connect_cursor_data.direction
                }
              });
              // arrow_now_data = {};
              arrow_mode = false;
            }
          }

        });

      }


    });
    
    document.onkeydown = function(e){
      // if(e.shiftKey){
      //   ShiftPush = true;
      // }
      ShiftPush = e.shiftKey;
    }
    document.onkeyup = function(e){
      ShiftPush = false;
    }
    canvas.addEventListener("mousemove", function(e){
      const rect = canvas.getBoundingClientRect();
      point.x = e.clientX - rect.left;
      point.y = e.clientY - rect.top;
      if(dragging){
        
        if(ContentsMaxMinAdmit({currentPositionX: dragging_contents_data.positionX,
            currentPositionY: dragging_contents_data.positionY,
            MaxPositionX: canvas.width, MinPositionX: 0, MaxPositionY: canvas.height, MinPositionY: 0})){
            //ボックスの範囲内だったら
            dragging_contents_data_histroy.push(dragging_contents_data);
            //トーナメント表の線より低くないと移動できるようにする。
            ContentsMove(dragging_contents_data.id, point.x - dragging_contents_data.width / 2, point.y - dragging_contents_data.height / 2,
              dragging_contents_data.width, dragging_contents_data.height);
            
            if(dragging_contents_data.children != null){
              
              dragging_contents_data.children.positionX = dragging_contents_data.positionX + dragging_contents_data.width / 2 - dragging_contents_data.children.width  - (dragging_contents_data.children.font_size / 2);
              dragging_contents_data.children.positionY = dragging_contents_data.positionY + dragging_contents_data.height / 2 - dragging_contents_data.children.height / 2 + (dragging_contents_data.children.font_size / 2);
              
            } 
            // }

        }else{
            ContentsMove(dragging_contents_data.id, dragging_contents_data_histroy[dragging_contents_data_histroy.length - 1].positionX, dragging_contents_data_histroy[dragging_contents_data_histroy.length - 1].positionY,
               dragging_contents_data.width, dragging_contents_data.height, dragging_contents_data);
        }
        

      }
      connect_relationship.forEach((connect_relation_ship_one) => {
        console.log(connect_relation_ship_one);
        if(ConnectRelationShipOnMouse(connect_relation_ship_one.center_line, point)){
          //トーナメント表同士を繋げてる真ん中の線にカーソルがあたったら
          console.log("Hitting----------------");
          tounament_relationship_cursor_data = {
            color: "orange",
            target_id: connect_relation_ship_one.id
          }
        }
      });

      //CursorMove
      if(arrow_position_select_mode){
        contents_data.forEach((contents_data_one) => {
          if(ContentsOnClickCheck(contents_data_one, point) && arrow_position_select_origin_contents.id == contents_data_one.id){
            let result = ArrowStartDurationInBoxClickCheck(contents_data_one, point);
            connect_cursor_data = {
              color: "orange",
              direction: result.direction,
              target_id: contents_data_one.id
            }
          }else{
          }
        });
      }else{
        // connect_cursor_data = {
        // }
      }
      if(arrow_mode){
        arrow_now_data.positionX = point.x;
        arrow_now_data.positionY = point.y;
      }


    });

    canvas.addEventListener("mouseup", function(e){

      const rect = canvas.getBoundingClientRect();
  
      point.x = e.clientX - rect.left;
      point.y = e.clientY - rect.top;
      

      if(ContentsOnClickCheck(ContentsDataGetById("delete_box_1"), point)){
        if(!dragging_contents_data.fixed){
          ContentsRemove(dragging_contents_data.id);
          if(dragging_contents_data.children != null){
            ContentsRemove(dragging_contents_data.children.id);
          }

        }
      }

      dragging = false;
      dragging_contents_data = {};
    });

    text_title_input.addEventListener("change", function(event){
      text_title_value = event.target.value;
    });

    font_size_input.addEventListener("change", function(event){
      font_size_value = event.target.value;
    });

    create_box_button.addEventListener("click", function(event){
      //ボックス作成ボタンを押したら

      //ボックス事態の追加
      ContentsAdd("contents_" + contents_index, 0, 0, width_value, height_value);
          
      let target_data = ContentsDataGetById(`contents_${contents_index - 1}`);
      //ボックスの中のTextの追加。
      ContentsAdd("text_" + contents_index, target_data.positionX + target_data.width / 2, target_data.positionY + target_data.height / 2,
                  ctx.measureText(text_title_value).width,ctx.measureText(text_title_value).height, "text", true, null, "black", text_title_value,null, font_size_value);

      target_data.children = ContentsDataGetById(`text_${contents_index - 1}`);
      
      target_data.children.fixed = true;
      //初期値設定。
      target_data.children.positionX = target_data.positionX + target_data.width / 2 - target_data.children.width  - (target_data.children.font_size / 2);
      target_data.children.positionY = target_data.positionY + target_data.height / 2 - target_data.children.height / 2 + (target_data.children.font_size / 2);
      
      // ctx.fillText("HelloWorld", , );
      // ContentsAdd("text_" + contents_index, 0, 0);
    });

    arrow_create_button.addEventListener("click", function(event){
      arrow_position_select_mode = true;
      
      ContextMenuManager("hide");
    });

    for(let i = 0; i < input_contents.length; i++){
      if(input_contents[i].dataset.mode == "width"){
        input_contents[i].value = default_width_value;
      }else if(input_contents[i].dataset.mode == "height"){
        input_contents[i].value = default_height_value;
      }
      input_contents[i].addEventListener("change", function(event){
        
        if(event.currentTarget.dataset.mode == "width"){
          width_value = Number(event.target.value);
          // contents_data.forEach((contents_data_one) => {
          //   contents_data_one.width = event.currentTarget.value;
          // });
        }else if(event.currentTarget.dataset.mode == "height"){
          height_value = Number(event.target.value);
          // contents_data.forEach((contents_data_one) => {
          //   contents_data_one.height = event.currentTarget.value;
          // });
        }
      });
    }



    canvas.addEventListener("contextmenu", function(e){

      contents_data.forEach((content_data, index) => {
        
        get_content_contextmenu = ContentsOnClickCheck(content_data, null, e.clientX, e.clientY);
        arrow_position_select_origin_contents = content_data;

        if(get_content_contextmenu){
          ContextMenuManager("show", e, content_data);
        }
      });

    });

    function ContextMenuManager(mode, e, content_data){
      if(mode=="show"){
        right_mouse_click_menu.style.display = "block";
        right_mouse_click_menu.style.top = e.clientY + "px";
        right_mouse_click_menu.style.left = e.clientX + "px";
        context_menu_on_contents_data_id = content_data.id;
        
      }else if(mode == "hide"){
        right_mouse_click_menu.style.display = "none";
        
      }
    }

  </script>
</body>
</html>
